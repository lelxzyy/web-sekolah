<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Deploy v4</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#0f172a,#1e293b,#312e81);
      color:white;
      overflow:hidden;
    }

    .card{
      width:90%;
      max-width:500px;
      padding:40px;
      border-radius:24px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,0.1);
      text-align:center;
      box-shadow:0 20px 50px rgba(0,0,0,0.4);
    }

    h1{
      font-size:42px;
      margin-bottom:15px;
    }

    h1 span{
      color:#38bdf8;
    }

    p{
      color:#cbd5e1;
      line-height:1.7;
      margin-bottom:25px;
    }

    .status{
      display:inline-block;
      padding:12px 20px;
      border-radius:12px;
      background:#38bdf8;
      color:#0f172a;
      font-weight:bold;
    }

    .circle{
      position:absolute;
      width:250px;
      height:250px;
      border-radius:50%;
      background:#38bdf8;
      filter:blur(120px);
      opacity:0.3;
    }

    .one{
      top:-50px;
      right:-50px;
    }

    .two{
      bottom:-50px;
      left:-50px;
      background:#8b5cf6;
    }
  </style>
</head>

<body>

  <div class="circle one"></div>
  <div class="circle two"></div>

  <div class="card">
    <h1>Auto <span>Deploy</span></h1>

    <p>
      Website berhasil diperbarui otomatis v2 menggunakan
      GitHub Webhook dan debian.
    </p>

    <div class="status">
      Deploy Berhasill 🚀
    </div>
  </div>

</body>
</html>
